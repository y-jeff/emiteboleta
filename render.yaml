# Deploy gratuito: servicio web Free de Render + PostgreSQL Free de Neon.
# La base de datos Free de Render vence a los 30 días, por eso se usa Neon.
# Guía paso a paso: docs/deploy-gratis.md
services:
  - type: web
    name: emiteboleta
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false  # Render la pide al crear el servicio: pega la URL de Neon
