{% extends "base.html" %}
{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-sm flex-col justify-center text-center">
  <div class="mx-auto mb-5 grid h-14 w-14 place-items-center rounded-2xl bg-brand-light text-2xl text-brand">{% block icono %}✓{% endblock %}</div>
  <h1 class="text-xl font-bold">{% block heading %}{% endblock %}</h1>
  <p class="mt-2 text-sm leading-relaxed text-slate-600">{% block texto %}{% endblock %}</p>
  <a href="{% block destino %}{% url 'cuentas:login' %}{% endblock %}" class="mt-6 rounded-xl bg-brand py-3 font-semibold text-white">{% block boton %}Ir a ingresar{% endblock %}</a>
</div>
{% endblock %}
